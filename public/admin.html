<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access administration · QUB-PHEO</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/access.css"><meta name="robots" content="noindex,nofollow"></head><body><header class="site-header"><a class="brand" href="/">QUB–PHEO</a><nav><a href="/">Public website</a><a href="/admin.html">Access administration</a></nav></header><main class="access-page admin-page"><p class="eyebrow">Private administration</p><h1>Dataset access requests</h1><p id="admin-status" role="status">Checking administrator sign-in…</p><div class="admin-tools"><button id="check-connection">Check Drive connection</button><button id="reload">Refresh requests</button><button id="export-audit">Export audit JSON</button></div><div class="admin-grid"><section><h2>Requests</h2><div id="request-list"></div></section><section id="detail" hidden><h2 id="applicant"></h2><dl id="request-fields"></dl><a id="evidence" href="#">Download signed EULA</a><p id="signature-hash" class="hash"></p><form id="decision-form"><label class="check"><input id="signature-checked" type="checkbox">I checked the signed PDF against the current agreement.</label><label class="check"><input id="identity-checked" type="checkbox">I verified the applicant’s institutional identity and intended use.</label><label>Review note<textarea id="review-note" maxlength="2000" rows="3"></textarea></label><div class="admin-tools"><button id="approve" type="button">Approve and grant Drive access</button><button id="deny" type="button">Deny request</button><button id="retry" type="button">Retry approved delivery</button></div></form><h3>Audit history</h3><div id="history"></div></section></div></main><script type="module" src="/admin.js"></script></body></html>
